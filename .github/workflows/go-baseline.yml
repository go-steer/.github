# go-baseline: shared checks every go-steer repo calls, on top of its own
# tests and lint. Call it pinned to a commit SHA:
#
#   jobs:
#     baseline:
#       uses: go-steer/.github/.github/workflows/go-baseline.yml@<sha>
#       permissions:
#         contents: read
#
# Jobs: workflow audit (actionlint, zizmor), shellcheck, and for Go repos
# govulncheck, deadcode and go-licenses. deadcode and go-licenses report
# without failing until a repo opts in, so adoption doesn't start red.
name: go-baseline

on:
  workflow_call:
    inputs:
      go:
        description: Run the Go jobs (govulncheck, deadcode, go-licenses).
        type: boolean
        default: true
      go-version-file:
        type: string
        default: go.mod
      deadcode-blocking:
        description: Fail when deadcode finds unreachable functions.
        type: boolean
        default: false
      licenses-blocking:
        description: Fail on dependencies outside the allowed licenses.
        type: boolean
        default: false
      allowed-licenses:
        type: string
        default: Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0
      zizmor-min-severity:
        type: string
        default: medium

permissions: {}

env:
  ACTIONLINT_VERSION: v1.7.12
  ZIZMOR_VERSION: 1.33.1
  GOVULNCHECK_VERSION: v1.10.0
  DEADCODE_VERSION: v0.53.0
  GO_LICENSES_VERSION: v2.0.1

jobs:
  workflows:
    name: workflow audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false
      - name: actionlint
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
      - name: zizmor
        env:
          MIN_SEVERITY: ${{ inputs.zizmor-min-severity }}
        run: pipx run "zizmor==${ZIZMOR_VERSION}" --offline --min-severity "$MIN_SEVERITY" --format github .github/workflows

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          set -euo pipefail
          # *.sh files plus extensionless scripts with a bash/sh shebang.
          mapfile -t files < <(git ls-files -z | xargs -0 -r grep -lIE '^#!(/usr/bin/env |/bin/)(ba)?sh' -- 2>/dev/null | sort -u)
          if ((${#files[@]} == 0)); then echo "No shell scripts."; exit 0; fi
          echo "Checking ${#files[@]} scripts"
          shellcheck --format=gcc "${files[@]}"

  govulncheck:
    if: inputs.go
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ inputs.go-version-file }}
      - run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  deadcode:
    if: inputs.go
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ inputs.go-version-file }}
      - name: deadcode
        env:
          BLOCKING: ${{ inputs.deadcode-blocking }}
        run: |
          set -euo pipefail
          out=$(go run "golang.org/x/tools/cmd/deadcode@${DEADCODE_VERSION}" -test ./... || true)
          if [[ -z "$out" ]]; then echo "No unreachable functions."; exit 0; fi
          { echo "## deadcode"; echo '```'; echo "$out"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          echo "$out"
          if [[ "$BLOCKING" == true ]]; then exit 1; fi
          echo "::warning::deadcode found $(wc -l <<<"$out") unreachable functions (report only; set deadcode-blocking to enforce)"

  licenses:
    name: go-licenses
    if: inputs.go
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ inputs.go-version-file }}
      - name: go-licenses check
        env:
          ALLOWED: ${{ inputs.allowed-licenses }}
          BLOCKING: ${{ inputs.licenses-blocking }}
        run: |
          set -euo pipefail
          if go run "github.com/google/go-licenses/v2@${GO_LICENSES_VERSION}" check ./... --allowed_licenses="$ALLOWED"; then
            exit 0
          fi
          if [[ "$BLOCKING" == true ]]; then exit 1; fi
          echo "::warning::go-licenses found dependencies outside the allowed licenses (report only; set licenses-blocking to enforce)"
