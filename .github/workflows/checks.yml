# checks: this repo's own CI. Runs the shared baseline on itself (no Go)
# and the shipyard script tests.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    uses: ./.github/workflows/go-baseline.yml
    permissions:
      contents: read
    with:
      go: false

  shipyard:
    name: shipyard tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shipyard/bin/test-parse-request.sh
      - name: create-repo dry run
        env:
          ORG: go-steer
          NAME: dry-run-repo
          DESCRIPTION: Dry run
          LANGUAGE: go
          CODE_OWNER: "@example"
          DRY_RUN: "1"
        run: shipyard/bin/create-repo.sh
